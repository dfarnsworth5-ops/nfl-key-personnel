<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Personnel — Cheatsheet</title>
<style>
  :root {
    --navy: #1a2744;
    --red: #c8102e;
    --accent: #7fcf8f;
    --bg: #fafafa;
    --border: #e2e2e2;
    --row-alt: #eef1f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: #1a1a1a;
  }
  .shell { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .banner {
    background: var(--navy);
    border-radius: 10px 10px 0 0;
    border-bottom: 3px solid var(--accent);
    padding: 16px 16px 18px;
    text-align: center;
  }
  .banner-title {
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.2px;
  }
  .banner-sub {
    color: #b9c2d6;
    font-size: 12px;
    margin-top: 4px;
  }

  .mode-toggle {
    display: flex;
    gap: 0;
    background: #fff;
    border: 1px solid var(--border);
    border-top: none;
    padding: 10px 14px 0;
  }
  .mode-btn {
    padding: 8px 18px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    color: #8a8f9c;
    border-bottom: 3px solid transparent;
  }
  .mode-btn.active {
    color: var(--navy);
    border-bottom-color: var(--accent);
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 1px solid var(--border);
    border-top: none;
    padding: 10px 14px;
  }
  #search {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    flex: 1;
    min-width: 140px;
    max-width: 240px;
  }
  .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 11px;
    font-weight: 700;
    color: #444;
    cursor: pointer;
    user-select: none;
    letter-spacing: 0.2px;
  }
  .chip.active {
    background: var(--navy);
    color: #fff;
    border-color: var(--navy);
  }

  .table-wrap { overflow-x: auto; overflow-y: auto; max-height: 640px; background: #fff; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; position: relative; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--navy);
    color: #fff;
    padding: 9px 8px;
    text-align: center;
    border-bottom: 3px solid var(--accent);
    cursor: pointer;
    user-select: none;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: normal;
  }
  thead th:first-child { text-align: left; }
  .arrow { font-size: 10px; color: var(--accent); margin-left: 3px; }
  tbody td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: center;
    white-space: nowrap;
  }
  tbody td:first-child { text-align: left; font-weight: 600; }
  tbody td.note-cell {
    text-align: left;
    white-space: normal;
    font-weight: 400;
    color: #444;
    font-size: 12px;
    min-width: 220px;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover td { filter: brightness(0.96); }

  .pos-badge, .tier-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.3px;
    line-height: 1.5;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="shell">
  <div class="banner">
    <div class="banner-title" id="bannerTitle">Noto's Key Personnel — Cheatsheet</div>
    <div class="banner-sub" id="bannerSub"></div>
  </div>
  <div class="mode-toggle" id="modeToggle">
    <div class="mode-btn active" data-mode="picks">Picks</div>
    <div class="mode-btn" data-mode="injuries">Injuries</div>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search name or team...">
    <div class="chip-group" id="posChips"></div>
    <div class="chip-group" id="tierChips"></div>
  </div>
  <div class="table-wrap">
    <table id="dataTable">
      <thead><tr id="headRow"></tr></thead>
      <tbody id="bodyRows"></tbody>
    </table>
  </div>
</div>

<script>
// ---- Colors, reused directly from the Showdown table's palette ----
const POS_COLORS = {
  QB:  "#2f6fed",
  RB:  "#3d9e5c",
  WR:  "#c9820a",
  TE:  "#8b5cf6",
  DST: "#c8102e"
};
const TIER_COLORS = {
  Core:     "#b8860b",   // gold — 🏆
  Strong:   "#2f6fed",   // blue — 💪
  Sprinkle: "#4a90c4"    // rain-blue — 🌧️
};
const TIER_ORDER = { Core: 0, Strong: 1, Sprinkle: 2 };
const STATUS_COLORS = {
  Out:          "#c8102e",   // brand red — most severe
  Doubtful:     "#d9770a",   // orange
  Questionable: "#b8960c"    // gold
};
const STATUS_ORDER = { Out: 0, Doubtful: 1, Questionable: 2 };
function tintStyle(color) { return `background:${color}1a; color:${color};`; }

// ---- Last updated timestamp — replace with the real publish time each week ----
const LAST_UPDATED = "2026-09-09T13:16:00";

// ---- Sample data — replace with the real weekly picks ----
// Structure: name, team, pos, tier, dk, fd, note (the one-line "why")
const SAMPLE_DATA = [
  { name: "J.J. McCarthy", team: "MIN", pos: "QB", tier: "Core", dk: 5200, fd: 6800, note: "Cheap dual-threat vs. Bears, 21st in EPA/dropback allowed" },
  { name: "Jacoby Brissett", team: "CIN", pos: "QB", tier: "Core", dk: 4900, fd: 7000, note: "25/21/25/21 fantasy pts in last 4 starts, great Niners matchup" },
  { name: "Brock Purdy", team: "SF", pos: "QB", tier: "Strong", dk: 5800, fd: 7100, note: "Cheap, stackable with CMC/Jennings/Kittle" },
  { name: "Justin Herbert", team: "LAC", pos: "QB", tier: "Strong", dk: 6600, fd: 8300, note: "Elite weapons, juicy Jaguars pass funnel" },
  { name: "Lamar Jackson", team: "BLT", pos: "QB", tier: "Sprinkle", dk: 6900, fd: 8600, note: "Salary won't get cheaper, Browns are a mild pass funnel" },
  { name: "Josh Allen", team: "BUF", pos: "QB", tier: "Sprinkle", dk: 7000, fd: 9000, note: "Elite floor, tougher run-funnel matchup this week" },

  { name: "Josh Jacobs", team: "GB", pos: "RB", tier: "Core", dk: 7800, fd: 9100, note: "Giants 32nd vs. run, nasty wind favors the ground game" },
  { name: "Chase Brown", team: "CIN", pos: "RB", tier: "Core", dk: 5700, fd: 7200, note: "100+ scrimmage yds in 3 straight with Flacco starting" },
  { name: "Jaylen Warren", team: "PIT", pos: "RB", tier: "Core", dk: 5400, fd: 6900, note: "Dream matchup vs. Bengals, 32nd in fantasy pts allowed to RBs" },
  { name: "Christian McCaffrey", team: "SF", pos: "RB", tier: "Strong", dk: 9000, fd: 10000, note: "83% snap share, bounce-back spot vs. Cardinals" },
  { name: "Bijan Robinson", team: "ATL", pos: "RB", tier: "Strong", dk: 8300, fd: 9300, note: "20+ touches likely, low recent ownership after a cold stretch" },
  { name: "Rico Dowdle", team: "CAR", pos: "RB", tier: "Strong", dk: 6800, fd: 8100, note: "3x 30-pt games this season, plus matchup vs. Falcons" },
  { name: "Derrick Henry", team: "BLT", pos: "RB", tier: "Sprinkle", dk: 6600, fd: 8000, note: "Cold/windy game script favors King Henry" },
  { name: "Kimani Vidal", team: "LAC", pos: "RB", tier: "Sprinkle", dk: 5900, fd: 7400, note: "Boom/bust role, 20+ carry upside if game stays close" },

  { name: "Jaxon Smith-Njigba", team: "SEA", pos: "WR", tier: "Core", dk: 8900, fd: 9700, note: "116 yds/game avg, fewer concerns than the other top WRs" },
  { name: "Michael Wilson", team: "ARZ", pos: "WR", tier: "Core", dk: 3800, fd: 5500, note: "WR1 role with Harrison out, cheap on both sites" },
  { name: "Puka Nacua", team: "LAR", pos: "WR", tier: "Strong", dk: 8700, fd: 9500, note: "28% target share, 39% air yards share in a top offense" },
  { name: "Ja'Marr Chase", team: "CIN", pos: "WR", tier: "Strong", dk: 8500, fd: 9400, note: "44/457/2 in 4 games with Flacco, Steelers are dead-last vs. WR" },
  { name: "Justin Jefferson", team: "MIN", pos: "WR", tier: "Strong", dk: 7500, fd: 8600, note: "Low ownership relative to McCarthy's own QB popularity" },
  { name: "Emeka Egbuka", team: "TB", pos: "WR", tier: "Sprinkle", dk: 7200, fd: 7900, note: "6-13-113-1 last week, Bucs stay aggressive as big dogs" },
  { name: "Jauan Jennings", team: "SF", pos: "WR", tier: "Sprinkle", dk: 5100, fd: 6200, note: "TD in back-to-back weeks, leads receivers in routes either way" },

  { name: "Trey McBride", team: "ARZ", pos: "TE", tier: "Core", dk: 6300, fd: 7700, note: "5 TDs in 4 games with Brissett, projects way above the field" },
  { name: "George Kittle", team: "SF", pos: "TE", tier: "Strong", dk: 5000, fd: 6600, note: "9-84-1 last week, way to get unique at the position" },
  { name: "Theo Johnson", team: "NYG", pos: "TE", tier: "Sprinkle", dk: 4100, fd: 5900, note: "5 TDs in last 8 games, nice red-zone matchup vs. Packers" },

  { name: "Packers", team: "GB", pos: "DST", tier: "Core", dk: 3200, fd: 4500, note: "Giants O-line allows pressure at a top-5 worst rate" },
  { name: "Titans", team: "TEN", pos: "DST", tier: "Core", dk: 2800, fd: 4200, note: "Facing a turnover-prone offense, cheap on both sites" },
  { name: "Jaguars", team: "JAX", pos: "DST", tier: "Strong", dk: 2600, fd: 4000, note: "Home dog spot, opposing OL among the league's most porous" },
  { name: "Browns", team: "CLV", pos: "DST", tier: "Strong", dk: 2400, fd: 3800, note: "Elite run-D unit, weather could force more Lamar dropbacks into pressure" },
  { name: "Texans", team: "HST", pos: "DST", tier: "Sprinkle", dk: 2200, fd: 3600, note: "Low-owned contrarian dart, elite pass rush vs. a shaky Bengals line" },
];

// ---- Sample injury data — replace with the real weekly report ----
const INJURY_DATA = [
  { name: "Jaxson Dart", team: "NYG", pos: "QB", status: "Out", injury: "Concussion" },
  { name: "C.J. Stroud", team: "HST", pos: "QB", status: "Out", injury: "Concussion" },
  { name: "Marvin Harrison Jr.", team: "ARZ", pos: "WR", status: "Out", injury: "Knee" },
  { name: "Bucky Irving", team: "TB", pos: "RB", status: "Doubtful", injury: "Foot" },
  { name: "Chris Godwin", team: "TB", pos: "WR", status: "Doubtful", injury: "Finger" },
  { name: "J.K. Dobbins", team: "DEN", pos: "RB", status: "Questionable", injury: "Knee" },
  { name: "Isiah Pacheco", team: "KC", pos: "RB", status: "Questionable", injury: "Ankle" },
  { name: "Rome Odunze", team: "CHI", pos: "WR", status: "Questionable", injury: "Hip" },
  { name: "Brian Thomas Jr.", team: "JAX", pos: "WR", status: "Questionable", injury: "Ankle" },
  { name: "Ricky Pearsall", team: "SF", pos: "WR", status: "Questionable", injury: "Shoulder" },
  { name: "Darius Slayton", team: "NYG", pos: "WR", status: "Questionable", injury: "Hamstring" },
  { name: "Dalton Kincaid", team: "BUF", pos: "TE", status: "Questionable", injury: "Hip" },
  { name: "Dalton Schultz", team: "HST", pos: "TE", status: "Questionable", injury: "Groin" }
];

let mode = "picks";
let sortKey = "dk";
let sortDir = -1;
let searchTerm = "";
let activePos = "ALL";
let activeTier = "ALL";

const PICKS_COLUMNS = [
  { key: "name", label: "Player", link: true },
  { key: "team", label: "Team" },
  { key: "pos", label: "Pos", badge: "pos" },
  { key: "tier", label: "Tier", badge: "tier" },
  { key: "dk", label: "DK Sal", fmt: "money" },
  { key: "fd", label: "FD Sal", fmt: "money" },
  { key: "note", label: "Why", note: true }
];

const INJURY_COLUMNS = [
  { key: "name", label: "Player", link: true },
  { key: "team", label: "Team" },
  { key: "pos", label: "Pos", badge: "pos" },
  { key: "status", label: "Status", badge: "status" },
  { key: "injury", label: "Injury" }
];

function fmt(val, type) {
  if (val === null || val === undefined || val === "") return "—";
  if (type === "money") return "$" + Number(val).toLocaleString();
  return val;
}

function normName(s) {
  return (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
}
let PLAYER_URLS = {};

function buildChips(containerId, values, active, onClick) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  values.forEach(v => {
    const chip = document.createElement("div");
    chip.className = "chip" + (v === active ? " active" : "");
    chip.textContent = v;
    chip.addEventListener("click", () => onClick(v));
    el.appendChild(chip);
  });
}

function render() {
  const isInjuries = mode === "injuries";
  const COLUMNS = isInjuries ? INJURY_COLUMNS : PICKS_COLUMNS;
  const DATA = isInjuries ? INJURY_DATA : SAMPLE_DATA;

  // Mode tabs
  document.querySelectorAll(".mode-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });

  // Position filter applies in both modes; Tier filter only makes sense for Picks
  buildChips("posChips", ["ALL", "QB", "RB", "WR", "TE", "DST"], activePos, v => { activePos = v; render(); });
  document.getElementById("tierChips").style.display = isInjuries ? "none" : "flex";
  if (!isInjuries) {
    buildChips("tierChips", ["ALL", "Core", "Strong", "Sprinkle"], activeTier, v => { activeTier = v; render(); });
  }

  const headRow = document.getElementById("headRow");
  headRow.innerHTML = "";
  COLUMNS.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col.label;
    if (sortKey === col.key) {
      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = sortDir === 1 ? "▲" : "▼";
      th.appendChild(arrow);
    }
    th.addEventListener("click", () => {
      if (sortKey === col.key) sortDir *= -1; else { sortKey = col.key; sortDir = 1; }
      render();
    });
    headRow.appendChild(th);
  });

  let rows = DATA.slice();
  if (activePos !== "ALL") rows = rows.filter(r => r.pos === activePos);
  if (!isInjuries && activeTier !== "ALL") rows = rows.filter(r => r.tier === activeTier);
  const q = searchTerm.trim().toLowerCase();
  if (q) rows = rows.filter(r => r.name.toLowerCase().includes(q) || r.team.toLowerCase().includes(q));

  rows.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === "tier") { av = TIER_ORDER[a.tier]; bv = TIER_ORDER[b.tier]; }
    if (sortKey === "status") { av = STATUS_ORDER[a.status]; bv = STATUS_ORDER[b.status]; }
    if (av === undefined) return 0;
    if (typeof av === "string") return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });

  const tbody = document.getElementById("bodyRows");
  tbody.innerHTML = "";
  rows.forEach(row => {
    const tr = document.createElement("tr");
    COLUMNS.forEach(col => {
      const td = document.createElement("td");
      const val = row[col.key];
      if (col.badge === "pos") {
        const span = document.createElement("span");
        span.className = "pos-badge";
        span.style.cssText = tintStyle(POS_COLORS[val] || "#6b7280");
        span.textContent = val;
        td.appendChild(span);
      } else if (col.badge === "tier") {
        const span = document.createElement("span");
        span.className = "tier-badge";
        const icon = val === "Core" ? "🏆" : val === "Strong" ? "💪" : "🌧️";
        span.style.cssText = tintStyle(TIER_COLORS[val] || "#6b7280");
        span.textContent = icon + " " + val;
        td.appendChild(span);
      } else if (col.badge === "status") {
        const span = document.createElement("span");
        span.className = "tier-badge";
        span.style.cssText = tintStyle(STATUS_COLORS[val] || "#6b7280");
        span.textContent = val;
        td.appendChild(span);
      } else if (col.link) {
        const url = PLAYER_URLS[normName(val)];
        if (url) {
          const a = document.createElement("a");
          a.href = url; a.target = "_blank"; a.rel = "noopener";
          a.textContent = fmt(val, col.fmt);
          a.style.color = "inherit"; a.style.textDecoration = "none";
          a.addEventListener("mouseenter", () => a.style.textDecoration = "underline");
          a.addEventListener("mouseleave", () => a.style.textDecoration = "none");
          td.appendChild(a);
        } else {
          td.textContent = fmt(val, col.fmt);
        }
      } else if (col.note) {
        td.className = "note-cell";
        td.textContent = val;
      } else {
        td.textContent = fmt(val, col.fmt);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.getElementById("bannerSub").textContent = LAST_UPDATED
    ? "Last updated: " + new Date(LAST_UPDATED).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })
    : "";
}

document.getElementById("search").addEventListener("input", e => { searchTerm = e.target.value; render(); });
document.getElementById("modeToggle").addEventListener("click", e => {
  const btn = e.target.closest(".mode-btn");
  if (!btn) return;
  mode = btn.dataset.mode;
  searchTerm = "";
  document.getElementById("search").value = "";
  sortKey = mode === "injuries" ? "status" : "dk";
  sortDir = mode === "injuries" ? 1 : -1;
  render();
});

// Load the shared player-URL lookup before the first render, so names
// link out immediately rather than popping in after a delayed fetch.
// Points at the copy hosted in nfl-showdown so there's one source of
// truth across First Look, Showdown, and Key Personnel — update it in
// exactly one place each week instead of three.
fetch("https://dfarnsworth5-ops.github.io/nfl-showdown/players.json")
  .then(r => r.json())
  .catch(() => ({}))
  .then(players => {
    PLAYER_URLS = players;
    render();
  });
</script>

</body>
</html>
